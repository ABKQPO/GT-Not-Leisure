name: Dev Release build

on:
  push:
    branches: [ master, main, release/**, dev-* ]
  pull_request:
    branches: [ master, main, release/**, dev-* ]
  workflow_dispatch:

concurrency:
  group: dev-release-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dev-build:
    runs-on: ubuntu-24.04

    env:
      SOURCE_REF: ${{ github.head_ref || github.ref_name }}
      SNAPSHOT: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[snapshot]')) || endsWith(github.event_name == 'pull_request' && github.head_ref || github.ref_name, '-snapshot') }}
      MAVEN_PUBLISHING_URL: ${{ vars.MAVEN_PUBLISHING_URL || 'https://nexus.gtnewhorizons.com/repository/releases/' }}

    steps:
      - name: Checkout mod repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 32

      - name: Set up JDK versions
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
            21
            25
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: yes
          validate-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set artifact version
        run: |
          version=$(printf '%s' "$SOURCE_REF" | LC_ALL=C sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          if [[ -z "$version" ]]; then
            version="${GITHUB_SHA:0:12}"
          fi
          printf 'VERSION=%s\nRELEASE_VERSION=%s\n' "$version" "$version" >> "$GITHUB_ENV"

      - name: Setup the workspace
        run: ./gradlew --build-cache --info --stacktrace setupCIWorkspace

      - name: Build the mod
        run: ./gradlew --build-cache --info --stacktrace assemble

      - name: Upload build artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-${{ github.event.pull_request.number }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: Dev Build
          body: Dynamic action build of branch ${{ github.ref_name }}
          tag_name: dev-build
          prerelease: false
          make_latest: true
          files: |
            build/libs/*.jar
