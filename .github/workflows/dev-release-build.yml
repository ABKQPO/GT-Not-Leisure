name: Dev Release build

on:
  push:
    branches: [ master, main, release/**, dev-* ]
  pull_request:
    branches: [ master, main, release/**, dev-* ]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('dev-release-build-pr-{0}', github.event.pull_request.number) || 'dev-release-build-release' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dev-build:
    runs-on: ubuntu-24.04

    env:
      SOURCE_REF: ${{ github.head_ref || github.ref_name }}
      SNAPSHOT: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[snapshot]')) || endsWith(github.event_name == 'pull_request' && github.head_ref || github.ref_name, '-snapshot') }}
      MAVEN_PUBLISHING_URL: ${{ vars.MAVEN_PUBLISHING_URL || 'https://nexus.gtnewhorizons.com/repository/releases/' }}

    steps:
      - name: Checkout mod repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 32

      - name: Set up JDK versions
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
            21
            25
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: yes
          validate-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set artifact version
        id: version
        run: |
          commit_short=$(git rev-parse --short=12 HEAD)
          branch_key=$(printf '%s' "$SOURCE_REF" | sha256sum | cut -c1-12)
          version=$(printf '%s' "$SOURCE_REF" | LC_ALL=C sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          if [[ -z "$version" ]]; then
            version="$commit_short"
          fi
          printf 'VERSION=%s\nRELEASE_VERSION=%s\nCOMMIT_SHORT=%s\nBRANCH_KEY=%s\n' \
            "$version" "$version" "$commit_short" "$branch_key" >> "$GITHUB_ENV"
          printf 'commit_short=%s\n' "$commit_short" >> "$GITHUB_OUTPUT"

      - name: Setup the workspace
        run: ./gradlew --build-cache --info --stacktrace setupCIWorkspace

      - name: Build the mod
        run: ./gradlew --build-cache --info --stacktrace assemble

      - name: Prepare release assets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          rm -rf build/release-assets
          mkdir -p build/release-assets
          find build/libs -maxdepth 1 -type f -name '*.jar' -print0 | while IFS= read -r -d '' file; do
            filename=$(basename "$file")
            cp "$file" "build/release-assets/${filename%.jar}-${BRANCH_KEY}-${COMMIT_SHORT}.jar"
          done
          find build/release-assets -maxdepth 1 -type f -name '*.jar' -printf '%f\n' > build/release-assets/asset-names.txt

      - name: Upload build artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-${{ github.event.pull_request.number }}-${{ steps.version.outputs.commit_short }}
          path: build/libs/*.jar
          if-no-files-found: error
          overwrite: true

      - name: Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: Dev Build
          body: |
            Dynamic action build of branch ${{ github.ref_name }}.
            Commit: `${{ steps.version.outputs.commit_short }}`
          tag_name: dev-build
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            build/release-assets/*.jar

      - name: Remove previous release builds
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_list=$(mktemp)
          trap 'rm -f "$asset_list"' EXIT
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/tags/dev-build/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' > "$asset_list"; then
            echo 'No existing dev-build release assets to remove.'
            exit 0
          fi
          while IFS=$'\t' read -r asset_id asset_name; do
            if [[ "$asset_name" == *-"$BRANCH_KEY"-*.jar ]] \
              && ! grep -Fqx -- "$asset_name" build/release-assets/asset-names.txt; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done < "$asset_list"
