gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('build/bee-breeder-qa-classes'))
    project.afterEvaluate {
        // GT's firestone integration is loaded during client initialization.
        project.dependencies.add('runtimeOnlyNonPublishable', 'com.github.GTNewHorizons:Railcraft:9.17.31:dev') {
            transitive = false
        }
    }
}

gradle.projectsEvaluated {
    def root = gradle.rootProject
    def qa = root.file(gradle.startParameter.projectProperties.get('beeBreederClientQaRoot')
        ?: 'build/bee-breeder-client-qa')
    root.tasks.named('compileTestJava').configure {
        options.release.set(17)
        destinationDirectory.set(new File(qa, 'client-classes'))
        classpath += root.files(root.tasks.named('compileJava').flatMap { it.destinationDirectory })
        setSource(root.files('scripts/qa/BeeBreederClientChecks.java'))
    }
    root.sourceSets.test.output.classesDirs.setFrom(
        root.files(new File(qa, 'client-classes')).builtBy(root.tasks.named('compileTestJava')))
    root.tasks.named('runClient17').configure {
        javaLauncher.set(root.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) })
        dependsOn root.tasks.named('testClasses')
        classpath += root.files(new File(qa, 'client-classes'))
        classpath += root.configurations.testRuntimeClasspath.filter { it.name.startsWith('jvmdowngrader-java-api-') }
        workingDir new File(qa, 'client-run')
        systemProperty 'gtnl.beeBreeder.client.qa', 'true'
        systemProperty 'gtnl.beeBreeder.client.qa.output', qa.absolutePath
        systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
        systemProperty 'sun.net.client.defaultReadTimeout', '15000'
        args '--width', '1100', '--height', '800'
        notCompatibleWithConfigurationCache('isolated bee breeder gameplay and visual verification')
        doFirst {
            classpath = root.files(classpath.files.findAll { it.exists() })
            new File(workingDir, 'config').mkdirs()
            java.nio.file.Files.deleteIfExists(new File(qa, 'client-result.txt').toPath())
            new File(workingDir, 'options.txt').setText(
                'lang:zh_CN\nguiScale:2\npauseOnLostFocus:false\nsoundCategory_master:0.0\nsoundCategory_music:0.0\nmusic:0.0\nsound:0.0\n', 'UTF-8')
            new File(workingDir, 'config/splash.properties').setText('enabled=false\n', 'UTF-8')
            new File(workingDir, 'config/DreamCoreMod.properties').setText('showConfirmExitWindow=false\n', 'UTF-8')
            root.copy {
                from root.file('run/client_new/falsepattern')
                include '*.jar'
                into new File(workingDir, 'falsepattern')
            }
            def helper = new File(qa, 'HideBeeBreederClient.ps1')
            helper.setText(root.file('scripts/qa/HideBeeBreederClient.ps1').getText('UTF-8'), 'UTF-8')
            new ProcessBuilder('powershell.exe', '-NoProfile', '-NonInteractive', '-WindowStyle', 'Hidden',
                '-ExecutionPolicy', 'Bypass', '-File', helper.absolutePath,
                '-Workspace', root.projectDir.absolutePath)
                .redirectErrorStream(true).redirectOutput(new File(qa, 'window-helper.log')).start()
        }
        doLast {
            def result = new File(qa, 'client-result.txt')
            if (!result.exists() || !result.text.startsWith('PASS'))
                throw new GradleException('Bee breeder QA failed; inspect client-result.txt and client log')
        }
    }
}
