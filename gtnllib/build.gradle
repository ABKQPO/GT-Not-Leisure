buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

ext.modName = 'GTNLLib'
ext.modId = 'gtnllib'
ext.modGroup = 'com.gtnllib'
ext.generateGradleTokenClass = ''
ext.accessTransformersFile = 'gtnllib_at.cfg'
ext.coreModClass = 'mixins.GTNLLibEarlyCoreMod'
ext.customArchiveBaseName = 'gtnllib'
// GTNH's IDE generator expects an IdeaProject, which Gradle only creates on the root project.
ext['gtnh.modules.ideIntegration'] = false

apply plugin: 'com.gtnewhorizons.gtnhconvention'
apply plugin: 'java-test-fixtures'
apply from: rootProject.file('repositories.gradle')

// Shared only with tests in this build; do not publish fixture jars as library variants.
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.testFixtures.compileClasspath += sourceSets.main.compileClasspath

dependencies {
    api('com.github.GTNewHorizons:GTNHLib:0.11.52:dev') { transitive = false }
    api('com.github.GTNewHorizons:ModularUI2:2.3.92-1.7.10:dev') { transitive = false }
    // MUI2 initializes its Baubles Expanded inventory adapter during preInit.
    runtimeOnly('com.github.GTNewHorizons:Baubles-Expanded:2.2.25-GTNH:dev') { transitive = false }
    implementation('com.github.GTNewHorizons:GTNHExtLib:1.0.5') { transitive = false }
    implementation('it.unimi.dsi:fastutil:8.5.18')
    implementation('org.joml:joml:1.10.8')
    implementation('org.ow2.asm:asm-commons:9.8')
    compileOnly('com.github.GTNewHorizons:ModularUI:1.3.4:dev') { transitive = false }
    compileOnly('com.github.GTNewHorizons:NotEnoughItems:2.8.155-GTNH:dev') { transitive = false }
    compileOnly('com.github.GTNewHorizons:CodeChickenCore:1.4.22:dev') { transitive = false }
    compileOnly('com.github.GTNewHorizons:Angelica:2.2.28:dev') { transitive = false }
    compileOnly('curse.maven:neverenoughanimation-1062347:7664003-sources-7663978') { transitive = false }
    compileOnly('com.github.GTNewHorizons:lwjgl3ify:3.0.34:api') { transitive = false }
    compileOnly('org.jetbrains:annotations:26.0.1')
    compileOnly('org.projectlombok:lombok:1.18.42')
    annotationProcessor('org.projectlombok:lombok:1.18.42')
}

tasks.named('compileJava', JavaCompile) {
    options.annotationProcessorPath = configurations.annotationProcessor
}

['jar', 'sourcesJar', 'testFixturesJar'].each { jarTask ->
    tasks.named(jarTask, Jar) {
        from('LICENSE.txt')
    }
}

tasks.register('verifyGTNLLib', JavaExec) {
    group = 'verification'
    description = 'Run library contracts without GTNL or GregTech on the classpath'
    dependsOn tasks.testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.gtnllib.GTNLLibContractTest'
    workingDir = projectDir
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
    dependsOn tasks.named('verifyGTNLLib')
}

configurations.create('distribution') {
    canBeConsumed = true
    canBeResolved = false
    attributes.attribute(org.gradle.api.attributes.Attribute.of('com.gtnllib.artifacts', String), 'distribution')
}

['reobfJar', 'downgradeJar', 'sourcesJar'].each { jarTask ->
    artifacts.add('distribution', tasks.named(jarTask))
}

['Client', 'Server'].each { side ->
    ['', '17', '21', '25'].each { version ->
        tasks.named("run${side}${version}", JavaExec) {
            workingDir = file("run/${side.toLowerCase()}${version ? '_new' : ''}")
            doFirst { workingDir.mkdirs() }
        }
    }
}
